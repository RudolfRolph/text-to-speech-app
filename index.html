<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistive Communication</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Assistive Communication</h1>

        <!-- MODE SELECTOR BUTTONS -->
        <div class="mode-selector">
            <button id="mode-tts" class="active">🗣️ I want to Type (Mute)</button>
            <button id="mode-stt">👂 I want to Read (Deaf)</button>
        </div>

        <!-- PANEL 1: TEXT TO SPEECH (For Mute Users) -->
        <div id="tts-panel" class="panel active">
            <p class="instruction">Type your message below. The computer will speak it for you.</p>
            
            <!-- NEW: The Emotion Dropdown Box -->
            <div class="emotion-container">
                <label for="emotion-select">Choose Emotion:</label>
                <select id="emotion-select">
                    <option value="neutral">😐 Neutral</option>
                    <option value="happy">😊 Happy</option>
                    <option value="excited">🤩 Excited</option>
                    <option value="sad">😢 Sad</option>
                    <option value="tired">😴 Tired</option>
                    <option value="monotone">🤖 Monotone</option>
                </select>
            </div>

            <textarea id="text-input" placeholder="Type your message here..."></textarea>
            <button id="speak-btn">Speak My Text</button>
        </div>

        <!-- PANEL 2: SPEECH TO TEXT (For Deaf Users) -->
        <div id="stt-panel" class="panel">
            <p class="instruction">Click the button below. When the other person speaks, their words will appear here.</p>
            <div id="transcript-output" class="transcript-box">Waiting for speech...</div>
            <button id="listen-btn">🎤 Start Listening</button>

            <div id="equalizer" class="equalizer">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </div>
            <p id="status"></p>
        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
